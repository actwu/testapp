<!doctype html>
<html lang="en">
<head>
<title>App Demo</title>
<meta name="description" content="A demo app with Material Symbols icons, dynamic routing, and SEO-friendly paths.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200&display=swap">
<style>
body {
margin:0;
font-family:sans-serif;
background:#111;
color:#fff;
display:flex;
flex-direction:column;
min-height:100vh;
}
header {
display:flex;
justify-content:flex-end;
align-items:center;
padding:0.75rem 1rem;
}
[icon] {
font-family:"Material Symbols Outlined", sans-serif;
font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
font-size:1.75rem;
color:#fff;
user-select:none;
}
button[icon-btn] {
background:none;
border:none;
cursor:pointer;
padding:0.25rem 0.5rem;
}
button[icon-btn].main {
font-size:2.25rem;
}
main {
flex:1;
padding:1rem;
display:flex;
flex-direction:column;
gap:1rem;
}
set {
display:block;
background:#1a1a1a;
padding:1rem;
border-radius:1rem;
}
set h2 {
margin:0 0 0.5rem 0;
font-size:1.25rem;
}
set p {
margin:0;
line-height:1.4;
}
nav {
display:flex;
justify-content:space-around;
align-items:center;
background:#111;
padding:0.75rem 1rem;
position:sticky;
bottom:0;
border-radius:1rem 1rem 0 0;
}
</style>
</head>
<body>
<header>
<button id="profile" icon-btn aria-label="Profile">
<span icon data-icon="account_circle">👤</span>
</button>
</header>
<main id="content">
<h1>Updates Near You</h1>
<set>
<h2>Power Maintenance</h2>
<p>Scheduled maintenance in your district tonight from 10 PM to 2 AM.</p>
</set>
<set>
<h2>Weather Alert</h2>
<p>Heavy rain expected tomorrow morning. Stay safe and plan ahead.</p>
</set>
</main>
<nav>
<button id="home" icon-btn aria-label="Home">
<span icon data-icon="home">🏠</span>
</button>
<button id="add" icon-btn class="main" aria-label="Add">
<span icon data-icon="add">➕</span>
</button>
<button id="notify" icon-btn aria-label="Notifications">
<span icon data-icon="notifications">🔔</span>
</button>
</nav>
<script defer>
const base="/testapp"
const render=path=>{
content.innerHTML=""
switch(path) {
case base+"/home":
content.insertAdjacentHTML("afterbegin","<h1>Home</h1><set><h2>Welcome</h2><p>This is your dashboard overview.</p></set>")
break
case base+"/create":
content.insertAdjacentHTML("afterbegin","<h1>Create</h1><set><h2>New Post</h2><p>Compose a new update for your area.</p></set>")
break
case base+"/notify":
content.insertAdjacentHTML("afterbegin","<h1>Notifications</h1><set><h2>Alerts</h2><p>No new alerts right now. Check back later.</p></set>")
break
case base+"/profile":
content.insertAdjacentHTML("afterbegin","<h1>Profile</h1><set><h2>User Settings</h2><p>Edit your account preferences here.</p></set>")
break
default:
content.insertAdjacentHTML("afterbegin","<h1>Updates Near You</h1><set><h2>Power Maintenance</h2><p>Scheduled maintenance in your district tonight from 10 PM to 2 AM.</p></set><set><h2>Weather Alert</h2><p>Heavy rain expected tomorrow morning. Stay safe and plan ahead.</p></set>")
}
}
const go=path=>{
history.pushState({}, "", base+path)
render(base+path)
}
home.onmousedown=()=>go("/home")
add.onmousedown=()=>go("/create")
notify.onmousedown=()=>go("/notify")
profile.onmousedown=()=>go("/profile")
window.onpopstate=()=>render(location.pathname)
window.onload=()=>render(location.pathname)
document.fonts.ready.then(()=>{
document.querySelectorAll("[icon]").forEach(el=>{
el.innerText=""
el.insertAdjacentText("afterbegin", el.dataset.icon)
})
})
</script>
</body>
</html>
